spring.application.name=vr-server-interface
storage.path.upload=${WEB_UPLOAD_DIR:uploads}
storage.path.pipeline-input=${PIPELINE_INPUT_DIR:../pipeline/input/original_image}
storage.path.download=${WEB_DOWNLOAD_DIR:downloads}
storage.path.glb=${PIPELINE_GLB_DIR:../pipeline/output/static_models}
storage.path.animated=${PIPELINE_ANIMATED_DIR:${PIPELINE_OUTPUT_DIR:../pipeline/output/animated_models}}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.address=0.0.0.0
server.port=8080
